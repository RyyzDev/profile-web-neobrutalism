<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form FAQ — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="../assets/main.js"></script>
    <link rel="stylesheet" href="../assets/style.css" />
</head>

<body class="font-body bg-base text-ink min-h-screen md:flex">

    <!-- Overlay untuk Mobile Sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed md:static inset-y-0 left-0 z-40 w-64 shrink-0 bg-white border-r-2 border-black p-5 transition-transform -translate-x-full md:translate-x-0 dark:bg-[#14171e] dark:border-[#282d3c]">

        <!-- Header Sidebar Mobile -->
        <div
            class="border-2 border-black bg-yellow-200 p-3 flex items-center justify-between md:hidden mb-6 shadow-[4px_4px_0_0] shadow-black dark:bg-yellow-600 dark:border-[#282d3c] dark:shadow-[#000000]">
            <span class="font-display font-bold text-black dark:text-white">Menu Admin</span>
            <button id="sidebar-close"
                class="w-8 h-8 flex items-center justify-center border-2 border-black bg-white hover:bg-red-300 transition-colors dark:border-[#282d3c] dark:bg-gray-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-black dark:text-white" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M18 6L6 18M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Navigasi -->
        <nav class="space-y-3">
            <a href="index.html"
                class="flex items-center gap-3 px-4 py-3 border-2 border-transparent hover:border-black hover:bg-white hover:shadow-[4px_4px_0_0] hover:shadow-black font-semibold text-gray-700 transition-all dark:text-gray-300 dark:hover:bg-[#1e222d] dark:hover:border-[#282d3c] dark:hover:shadow-[#000000]">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>
                </svg>
                Kelola Profil
            </a>
            <a href="portfolio.html"
                class="flex items-center gap-3 px-4 py-3 border-2 border-transparent hover:border-black hover:bg-white hover:shadow-[4px_4px_0_0] hover:shadow-black font-semibold text-gray-700 transition-all dark:text-gray-300 dark:hover:bg-[#1e222d] dark:hover:border-[#282d3c] dark:hover:shadow-[#000000]">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="7" width="18" height="13" rx="2"></rect>
                    <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Kelola Portfolio
            </a>
            <!-- Active Link: Kelola FAQ -->
            <a href="faq.html"
                class="flex items-center gap-3 px-4 py-3 border-2 border-black bg-yellow-300 shadow-[4px_4px_0_0] shadow-black font-bold text-black dark:bg-yellow-500 dark:border-[#282d3c] dark:shadow-[#000000]">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                Kelola FAQ
            </a>
        </nav>

        <!-- Logout -->
        <a href="../index.html"
            class="flex items-center gap-3 px-4 py-3 mt-10 border-2 border-transparent hover:border-black hover:bg-red-200 hover:shadow-[4px_4px_0_0] hover:shadow-black font-bold text-red-600 transition-all dark:text-red-400 dark:hover:bg-red-900/50 dark:hover:border-[#282d3c] dark:hover:shadow-[#000000]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="M16 17l5-5-5-5"></path>
                <path d="M21 12H9"></path>
            </svg>
            Keluar
        </a>
    </aside>

    <!-- Konten Utama -->
    <main class="flex-1 p-6 md:p-10 max-w-4xl">

        <!-- Tombol Buka Sidebar (Mobile) -->
        <button id="sidebar-open"
            class="w-12 h-12 flex items-center justify-center border-2 border-black bg-white shadow-[4px_4px_0_0] shadow-black mb-6 md:hidden hover:bg-yellow-200 active:translate-y-1 active:shadow-[2px_2px_0_0] transition-all dark:bg-[#14171e] dark:border-[#282d3c] dark:text-white dark:shadow-[#000000]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 7h16M4 12h16M4 17h16"></path>
            </svg>
        </button>

        <!-- Tombol Kembali -->
        <a href="faq.html"
            class="inline-flex items-center gap-2 font-bold text-sm mb-6 text-ink hover:underline">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Kembali ke Daftar FAQ
        </a>

        <!-- Header Halaman -->
        <div class="mb-8">
            <h1 id="page-title" class="font-display text-3xl font-bold dark:text-white">Tambah FAQ Baru</h1>
            <p id="page-subtitle" class="text-black/70 font-medium mt-2 dark:text-gray-400">
                Buat pertanyaan dan jawaban yang sering diajukan untuk pengunjung website.
            </p>
        </div>

        <!-- Form Box -->
        <div class="border-2 border-black bg-white p-6 md:p-8 shadow-[8px_8px_0_0] shadow-black dark:bg-[#14171e] dark:border-[#282d3c] dark:shadow-[#000000]">
            <form id="faq-form" action="faq.html" method="GET">

                <!-- Pertanyaan -->
                <div class="mb-6">
                    <label for="pertanyaan" class="block font-bold text-sm text-black mb-2 dark:text-white">Pertanyaan</label>
                    <input type="text" id="pertanyaan" placeholder="Contoh: Sehari butuh berapa gelas kopi kalo lagi ngoding?" required
                        class="w-full border-2 border-black bg-white px-4 py-3 font-medium text-black focus:outline-none focus:ring-0 focus:bg-yellow-50 shadow-[4px_4px_0_0] shadow-black transition-colors dark:bg-[#1e222d] dark:border-[#282d3c] dark:text-white dark:shadow-[#000000] dark:focus:bg-[#2a3040]" />
                </div>

                <!-- Jawaban -->
                <div class="mb-8">
                    <label for="jawaban" class="block font-bold text-sm text-black mb-2 dark:text-white">Jawaban</label>
                    <textarea id="jawaban" rows="5" required placeholder="Contoh: mungkin 4-6 gelas kopi tanpa gula :)"
                        class="w-full resize-y border-2 border-black bg-white p-4 font-medium text-black leading-relaxed focus:outline-none focus:ring-0 focus:bg-yellow-50 shadow-[4px_4px_0_0] shadow-black transition-colors dark:bg-[#1e222d] dark:border-[#282d3c] dark:text-white dark:shadow-[#000000] dark:focus:bg-[#2a3040]"></textarea>
                </div>

                <!-- Tombol Aksi -->
                <div class="flex flex-col sm:flex-row gap-4 border-t-2 border-black border-dashed pt-6 dark:border-[#282d3c]">
                    <a href="faq.html"
                        class="text-center sm:flex-1 border-2 border-black bg-gray-200 py-3 font-bold text-black shadow-[4px_4px_0_0] shadow-black hover:-translate-y-1 hover:shadow-[6px_6px_0_0] transition-all dark:bg-gray-700 dark:border-[#282d3c] dark:text-white dark:shadow-[#000000]">
                        Batal
                    </a>
                    <button type="submit"
                        class="sm:flex-1 border-2 border-black bg-green-400 py-3 font-bold text-black shadow-[4px_4px_0_0] shadow-black hover:-translate-y-1 hover:shadow-[6px_6px_0_0] transition-all dark:bg-green-600 dark:border-[#282d3c] dark:text-white dark:shadow-[#000000]">
                        Simpan FAQ
                    </button>
                </div>

            </form>
        </div>

    </main>
</body>

</html>
