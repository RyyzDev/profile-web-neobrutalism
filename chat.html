<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanya AI — Web Profil</title>
  <link rel="icon" href="assets/icons/favicon.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/main.js"></script>
  <link rel="stylesheet" href="./assets/style.css" />
</head>

<body class="font-body bg-base text-ink min-h-screen flex flex-col">

  <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-10 flex-1 flex flex-col">
    <!-- Bar Navigasi Atas -->
    <div class="flex items-center justify-between gap-4 mb-6">
      <a href="index.html"
        class="inline-flex items-center gap-2 border-2 border-black bg-white px-3.5 py-2 font-bold text-sm text-ink shadow-[3px_3px_0_0] shadow-black hover:-translate-y-0.5 hover:shadow-[5px_5px_0_0] transition-all dark:bg-[#1e222d] dark:border-[#282d3c] dark:shadow-[#000000]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Kembali ke Beranda</span>
      </a>

      <!-- Tombol Switch Dark/Light Mode -->
      <button id="theme-toggle" type="button" aria-label="Ubah Tema"
        class="neu-icon-btn w-11 h-11 flex items-center justify-center shrink-0 text-ink">
        <svg id="theme-toggle-dark-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.7"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
        <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.7"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m0 13.5V21m8.966-8.966h-2.25m-13.5 0H3m15.364 6.364l-1.591-1.591M6.758 6.758L5.167 5.167m12.728 0l-1.591 1.591M6.758 17.242l-1.591 1.591M12 18a6 6 0 100-12 6 6 0 000 12z" />
        </svg>
      </button>
    </div>

    <!-- Container Utama Percakapan AI (Halaman Penuh, Bukan Modal) -->
    <div class="border-2 border-black bg-white shadow-[8px_8px_0_0] shadow-black dark:bg-[#14171e] dark:border-[#282d3c] dark:shadow-[#000000] flex-1 flex flex-col overflow-hidden">
      
      <!-- Header Ruang Chat -->
      <div class="border-b-2 border-black bg-yellow-300 px-5 py-4 dark:bg-yellow-500 dark:border-[#282d3c] flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="relative w-10 h-10 flex items-center justify-center border-2 border-black bg-white rounded-full dark:border-[#282d3c] dark:bg-[#1e222d]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-ink" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-black rounded-full"></span>
          </div>
          <div>
            <h1 class="font-display font-bold text-lg text-ink leading-tight">Asisten AI Profil</h1>
            <p class="text-xs font-semibold text-ink/75">Online &bull; Siap menjawab seputar keahlian, proyek, dan kontak</p>
          </div>
        </div>

        <span class="hidden sm:inline-flex items-center gap-1.5 border border-black bg-white px-2.5 py-1 text-xs font-bold text-ink dark:border-[#282d3c] dark:bg-[#1e222d]">
          <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
          Aktif
        </span>
      </div>

      <!-- Area Pesan (Scrollable) -->
      <div id="chatbot-messages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 min-h-[380px] text-sm bg-gray-50/70 dark:bg-[#10131a]">
        <!-- Pesan Pembuka AI -->
        <div class="flex items-start gap-3">
          <div class="shrink-0 w-8 h-8 rounded-full border-2 border-black bg-yellow-200 flex items-center justify-center text-xs font-bold dark:border-[#282d3c] text-ink">
            AI
          </div>
          <div class="border-2 border-black bg-white p-4 shadow-[3px_3px_0_0] shadow-black max-w-[85%] text-ink dark:bg-[#1e222d] dark:border-[#282d3c] dark:shadow-[#000000]">
            <p class="leading-relaxed">Halo! 👋 Selamat datang di halaman <strong>Tanya AI</strong>. Ada yang ingin kamu tanyakan seputar portofolio, keahlian teknis, atau info kontak saya?</p>
          </div>
        </div>

        <!-- Quick Suggestions Chips -->
        <div id="chatbot-suggestions" class="pt-2 flex flex-wrap gap-2 pl-11">
          <button type="button" class="chatbot-chip border border-black bg-white px-3 py-1.5 text-xs font-semibold text-ink hover:bg-yellow-200 hover:-translate-y-0.5 transition-all shadow-[2px_2px_0_0] shadow-black dark:border-[#282d3c] dark:bg-[#1e222d] dark:hover:bg-yellow-600 dark:shadow-[#000000]">
            Apa keahlian utamamu?
          </button>
          <button type="button" class="chatbot-chip border border-black bg-white px-3 py-1.5 text-xs font-semibold text-ink hover:bg-yellow-200 hover:-translate-y-0.5 transition-all shadow-[2px_2px_0_0] shadow-black dark:border-[#282d3c] dark:bg-[#1e222d] dark:hover:bg-yellow-600 dark:shadow-[#000000]">
            Lihat proyek portofolio
          </button>
          <button type="button" class="chatbot-chip border border-black bg-white px-3 py-1.5 text-xs font-semibold text-ink hover:bg-yellow-200 hover:-translate-y-0.5 transition-all shadow-[2px_2px_0_0] shadow-black dark:border-[#282d3c] dark:bg-[#1e222d] dark:hover:bg-yellow-600 dark:shadow-[#000000]">
            Bagaimana cara kontak?
          </button>
          <button type="button" class="chatbot-chip border border-black bg-white px-3 py-1.5 text-xs font-semibold text-ink hover:bg-yellow-200 hover:-translate-y-0.5 transition-all shadow-[2px_2px_0_0] shadow-black dark:border-[#282d3c] dark:bg-[#1e222d] dark:hover:bg-yellow-600 dark:shadow-[#000000]">
            Berapa gelas kopi sehari?
          </button>
        </div>
      </div>

      <!-- Area Input Pesan -->
      <form id="chatbot-form" class="border-t-2 border-black bg-white p-3 sm:p-4 flex gap-2 sm:gap-3 dark:bg-[#14171e] dark:border-[#282d3c]">
        <input type="text" id="chatbot-input" placeholder="Tulis pertanyaanmu di sini... (mendukung format markdown #, code, **bold**)" autocomplete="off" required autofocus
          class="flex-1 border-2 border-black bg-white px-4 py-3 text-sm text-ink focus:outline-none focus:bg-yellow-50 shadow-[3px_3px_0_0] shadow-black dark:bg-[#1e222d] dark:border-[#282d3c] dark:shadow-[#000000] dark:focus:bg-[#282d3c]" />
        <button type="submit" aria-label="Kirim Pesan"
          class="border-2 border-black bg-yellow-300 px-5 py-3 font-bold text-ink shadow-[3px_3px_0_0] shadow-black hover:bg-yellow-400 hover:-translate-y-0.5 active:translate-y-0 active:shadow-none transition-all dark:bg-yellow-500 dark:border-[#282d3c] flex items-center gap-2">
          <span class="hidden sm:inline text-sm">Kirim</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

    </div>
  </main>

</body>

</html>
