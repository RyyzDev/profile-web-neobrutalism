<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Halaman Tidak Ditemukan</title>
  <link rel="icon" href="assets/icons/favicon.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/main.js"></script>
  <link rel="stylesheet" href="./assets/style.css" />
</head>

<body class="font-body bg-base text-ink min-h-screen flex items-center justify-center p-6">

  <main class="w-full max-w-lg mx-auto">

    <!-- Tombol Switch Dark/Light Mode -->
    <div class="flex justify-end mb-4">
      <button id="theme-toggle" type="button" aria-label="Ubah Tema"
        class="neu-icon-btn w-11 h-11 flex items-center justify-center shrink-0 text-ink">
        <!-- Ikon Bulan -->
        <svg id="theme-toggle-dark-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.7"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
        <!-- Ikon Matahari -->
        <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.7"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m0 13.5V21m8.966-8.966h-2.25m-13.5 0H3m15.364 6.364l-1.591-1.591M6.758 6.758L5.167 5.167m12.728 0l-1.591 1.591M6.758 17.242l-1.591 1.591M12 18a6 6 0 100-12 6 6 0 000 12z" />
        </svg>
      </button>
    </div>

    <!-- 404 Error Card -->
    <div
      class="border-2 border-black bg-white p-8 md:p-10 text-center shadow-[8px_8px_0_0] shadow-black dark:bg-[#14171e] dark:border-[#282d3c] dark:shadow-[#000000]">

      <!-- Badge / Kode Error -->
      <div
        class="inline-block border-2 border-black bg-red-300 px-4 py-1.5 text-xs font-mono font-bold tracking-wider text-black shadow-[3px_3px_0_0] shadow-black dark:border-[#282d3c] dark:shadow-[#000000] mb-6">
        ERROR
      </div>

      <!-- Angka 404 Besar -->
      <h1 class="font-display text-7xl md:text-8xl font-bold tracking-tight text-black dark:text-white mb-4">
        4<span class="text-yellow-400">0</span>4
      </h1>

      <!-- Judul Pesan -->
      <h2 class="font-display text-2xl md:text-3xl font-bold text-black dark:text-white mb-3">
        Halaman Tidak Ditemukan
      </h2>

      <!-- Deskripsi Pesan -->
      <p class="text-sm md:text-base text-black/70 dark:text-gray-400 leading-relaxed max-w-sm mx-auto mb-8">
        Ups! Halaman yang kamu tuju sepertinya tidak ada, telah dipindahkan, atau alamat URL yang dimasukkan keliru.
      </p>

      <!-- Tombol Aksi -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
        <a href="index.html"
          class="w-full sm:w-auto inline-flex items-center justify-center gap-2 border-2 border-black bg-yellow-300 px-6 py-3 font-bold text-black shadow-[4px_4px_0_0] shadow-black hover:-translate-y-1 hover:shadow-[6px_6px_0_0] active:translate-y-0 active:shadow-[2px_2px_0_0] transition-all dark:bg-yellow-500 dark:border-[#282d3c] dark:shadow-[#000000]">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
          </svg>
          Kembali ke Beranda
        </a>
      </div>

    </div>

  </main>
</body>

</html>
